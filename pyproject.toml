[project]
name = "ciphercanvas"
version = "0.1.0"
description = "CipherCanvas: Intelligent Post-Quantum Data Protection and Secure Media Vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "numpy",
    "pandas",
    "pillow",
    "qiskit>=2.0.0",
    "qiskit-aer>=0.18.0",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
