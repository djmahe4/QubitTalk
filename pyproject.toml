[project]
name = "quantum-hackday"
version = "0.1.0"
description = "CipherCanvas: post-quantum media vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "numpy",
    "pandas",
    "pillow",
    "streamlit",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
